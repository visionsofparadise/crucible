<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500&amp;family=Doto:wght@400;600;800&amp;family=VT323&amp;family=Micro+5&amp;family=Share+Tech+Mono&amp;family=Nova+Mono&amp;family=Rye&amp;family=Metal+Mania&amp;family=Pirata+One&amp;family=Caesar+Dressing&amp;family=Special+Elite&amp;family=Cherry+Bomb+One&amp;family=Nosifer&amp;family=Eater&amp;display=swap" rel="stylesheet">
  <style>
    @keyframes cru-spin { to { transform: rotate(360deg); } }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #100F0C; font-family: 'Azeret Mono', monospace; color: #E8E3DB; }
    a { color: #E0653C; }
    a:hover { color: #F0834A; }
    ::selection { background: rgba(224,101,60,0.3); }
    [data-ruler]::-webkit-scrollbar { width: 14px; height: 14px; }
    [data-ruler]::-webkit-scrollbar-track { background: #090806; }
    [data-ruler]::-webkit-scrollbar-track:horizontal { box-shadow: inset 0 1px 0 0 #2A2620; }
    [data-ruler]::-webkit-scrollbar-track:vertical { box-shadow: inset 1px 0 0 0 #2A2620; }
    [data-ruler]::-webkit-scrollbar-thumb { background: #3A3632; border-radius: 1px; }
    [data-ruler]::-webkit-scrollbar-thumb:hover { background: #5A5550; }
    [data-ruler]::-webkit-scrollbar-corner { background: #090806; }
  </style>
  <script src="faust-path.js"></script>
</helmet>

<div style="min-height:100vh;background:radial-gradient(120% 120% at 50% -10%, #1A1815 0%, #100F0C 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px 24px;gap:16px;font-family:'Azeret Mono',monospace">

  <div ref="{{ frameRef }}" data-screen-label="Crucible Plugin" style="width: 680px; background: #1C1A17; overflow: hidden; color: #E8E3DB; box-shadow: 0 30px 70px rgba(0,0,0,0.6), 0 2px 0 rgba(255,255,255,0.03), inset 0 1px 0 rgba(255,255,255,0.07)">

    <!-- HEADER -->
    <div style="display:flex;align-items:center;gap:14px;background:linear-gradient(180deg,#2B2925 0%,#232019 100%);padding:15px 18px;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), 0 1px 2px rgba(0,0,0,0.4);position:relative;z-index:0;overflow:hidden">
      <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;z-index:-1;background-image:url('textures/metal.jpg');background-size:cover;background-position:center;mix-blend-mode:var(--metal-blend,soft-light);opacity:var(--metal-strength,0.3)"></div>
      <sc-if value="{{ isInstrument }}" hint-placeholder-val="{{ true }}">
        <svg width="26" height="26" viewBox="0 0 32 32" style="flex:none;filter:drop-shadow(0 0 5px color-mix(in srgb, var(--accent,#E0653C) 45%, transparent))">
          <circle cx="16" cy="16" r="14.5" stroke="var(--accent,#E0653C)" fill="none" stroke-width="1.4"></circle>
          <circle cx="16" cy="16" r="3" fill="var(--accent,#E0653C)"></circle>
        </svg>
      </sc-if>
      <sc-if value="{{ isFx }}" hint-placeholder-val="{{ false }}">
        <svg width="26" height="26" viewBox="0 0 32 32" style="flex:none;filter:drop-shadow(0 0 5px color-mix(in srgb, var(--accent,#E0653C) 45%, transparent))">
          <circle cx="16" cy="16" r="14.5" stroke="var(--accent,#E0653C)" fill="none" stroke-width="1.4"></circle>
          <circle cx="16" cy="16" r="10" stroke="var(--accent,#E0653C)" fill="none" stroke-width="1.4" opacity="0.6"></circle>
          <circle cx="16" cy="16" r="5.5" stroke="var(--accent,#E0653C)" fill="none" stroke-width="1.4" opacity="0.4"></circle>
        </svg>
      </sc-if>
      <span ref="{{ titleRef }}" style="font-family:var(--title-font,'Pirata One'),cursive;font-size:38px;text-transform:uppercase;letter-spacing:0.02em;color:#F0EBE3;line-height:0.85;font-weight:400;text-shadow:0 1px 0 rgba(0,0,0,0.6), 0 0 18px color-mix(in srgb, var(--accent,#E0653C) 24%, transparent);transform:rotate(-1deg)">CRUCIBLE</span>
      

      <button type="button" aria-label="Bypass" onClick="{{ toggleBypass }}" style="margin-left:auto;width:22px;height:22px;border:none;border-radius:6px;background:{{ powerBtnBg }};box-shadow:{{ powerBtnShadow }};transform:{{ powerBtnTransform }};transition:transform 0.09s ease, box-shadow 0.14s ease;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
          <path d="M12 3.4 L12 11.6" stroke="{{ powerColor }}" stroke-width="1.4" stroke-linecap="round"></path>
          <path d="M7.4 6.7 a6 6 0 1 0 9.2 0" stroke="{{ powerColor }}" stroke-width="1.4" stroke-linecap="round"></path>
        </svg>
      </button>
    </div>

    <!-- SEAM header/body -->
    <div style="height:2px;background:linear-gradient(180deg, rgba(255,255,255,0.11) 0%, rgba(255,255,255,0.03) 35%, rgba(0,0,0,0.55) 100%)"></div>

    <!-- INPUT TOOLBAR (full width) -->
    <div style="display:flex;align-items:center;gap:8px;padding:9px 16px;background:linear-gradient(180deg,#2B2925 0%,#232019 100%);position:relative;z-index:0;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,0.04)">
      <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;z-index:-1;background-image:url('textures/metal.jpg');background-size:cover;background-position:center;mix-blend-mode:var(--metal-blend,soft-light);opacity:var(--metal-strength,0.3)"></div>
      <span style="font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:#7A7570">INPUT</span>
      <div style="margin-left:auto;display:flex;align-items:center;gap:5px">
        <button type="button" style="{{ toolBtnStyle }}" style-hover="color:#E8E3DB;border-color:var(--accent,#E0653C)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 22h14a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v4"></path><path d="M14 2v4a2 2 0 0 0 2 2h4"></path><path d="m9 18 3-3-3-3"></path><path d="m5 12-3 3 3 3"></path></svg>
          <span>COPY CONTEXT</span>
        </button>
        <button type="button" style="{{ toolBtnStyle }}" style-hover="color:#E8E3DB;border-color:var(--accent,#E0653C)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"></path></svg>
          <span>OPEN</span>
        </button>
        <button type="button" style="{{ toolBtnStyle }}" style-hover="color:#E8E3DB;border-color:var(--accent,#E0653C)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"></path><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7"></path><path d="M7 3v4a1 1 0 0 0 1 1h7"></path></svg>
          <span>SAVE</span>
        </button>
        <button type="button" style="{{ toolBtnStyle }}" style-hover="color:#E8E3DB;border-color:var(--accent,#E0653C)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>
          <span>COPY</span>
        </button>
        <button type="button" style="{{ toolBtnStyle }}" style-hover="color:#E8E3DB;border-color:var(--accent,#E0653C)">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg>
          <span>PASTE</span>
        </button>
      </div>
    </div>

    <!-- CODE SCREEN + METER RAIL -->
    <div style="display:flex;align-items:stretch">
      <!-- IN METER RAIL: LED SCREEN (left of editor, FX only) -->
      <sc-if value="{{ isFx }}" hint-placeholder-val="{{ false }}">
        <div style="flex:none;position:relative;background:#0A0806;border-right:1px solid #000;box-shadow:inset 0 2px 14px rgba(0,0,0,0.85), inset 0 0 44px rgba(0,0,0,0.4);display:flex;flex-direction:column;z-index:0">
          <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;z-index:0;background-image:url('textures/glass.jpg');background-size:cover;background-position:center;mix-blend-mode:var(--glass-blend,screen);opacity:var(--glass-strength,0.12)"></div>
          <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;z-index:2;background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 3px, rgba(0,0,0,0.22) 3px, rgba(0,0,0,0.22) 4px)"></div>
          <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;z-index:3;background:linear-gradient(157deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 14%, rgba(255,255,255,0) 32%)"></div>
          <div style="position:relative;z-index:1;padding:14px 14px;display:flex;gap:12px;flex:1;min-height:0;justify-content:center">
            <div style="display:flex;flex-direction:column;align-items:center;gap:6px;min-height:0">
              <span style="font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:#7A7570">IN</span>
              <div style="display:flex;gap:5px"><span style="font-size:9px;color:#5A5550;width:7px;text-align:center">L</span><span style="font-size:9px;color:#5A5550;width:7px;text-align:center">R</span></div>
              <div style="display:flex;gap:5px;flex:1;min-height:0;align-items:stretch">
                <div style="position:relative;width:7px;background:#17150F;border-radius:1px;box-shadow:inset 0 1px 2px rgba(0,0,0,0.6);overflow:hidden"><div ref="{{ inLRef }}" style="position:absolute;bottom:0;width:100%;height:44%;background:linear-gradient(to top,#E8E3DB,var(--accent,#E0653C))"></div><div style="position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to top,rgba(9,8,6,0) 0px,rgba(9,8,6,0) 2.6px,#090806 2.6px,#090806 4.1px)"></div></div>
                <div style="position:relative;width:7px;background:#17150F;border-radius:1px;box-shadow:inset 0 1px 2px rgba(0,0,0,0.6);overflow:hidden"><div ref="{{ inRRef }}" style="position:absolute;bottom:0;width:100%;height:40%;background:linear-gradient(to top,#E8E3DB,var(--accent,#E0653C))"></div><div style="position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to top,rgba(9,8,6,0) 0px,rgba(9,8,6,0) 2.6px,#090806 2.6px,#090806 4.1px)"></div></div>
              </div>
              <div style="display:flex;flex-direction:column;align-items:center"><span style="font-family:var(--lcd-font,'Doto'),monospace;font-size:9px;font-variant-numeric:tabular-nums;color:#9A9088;text-shadow:0 0 5px rgba(154,144,136,0.4);width:5ch;text-align:center">-6.0</span><span style="font-family:var(--lcd-font,'Doto'),monospace;font-size:9px;font-variant-numeric:tabular-nums;color:#9A9088;text-shadow:0 0 5px rgba(154,144,136,0.4);width:5ch;text-align:center">-7.2</span></div>
            </div>
          </div>
        </div>
      </sc-if>
      <!-- code LED screen -->
      <div style="position:relative;flex:1;min-width:0;height:296px;background:#0A0806;box-shadow:inset 0 2px 14px rgba(0,0,0,0.85), inset 0 0 44px rgba(0,0,0,0.4);overflow:hidden;z-index:0">
        <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;z-index:0;background-image:url('textures/glass.jpg');background-size:cover;background-position:center;mix-blend-mode:var(--glass-blend,screen);opacity:var(--glass-strength,0.12)"></div>
        <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;z-index:2;background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 3px, rgba(0,0,0,0.22) 3px, rgba(0,0,0,0.22) 4px)"></div>
        <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;z-index:3;background:linear-gradient(157deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 12%, rgba(255,255,255,0) 30%), radial-gradient(135% 90% at 46% -25%, rgba(255,255,255,0.05), rgba(255,255,255,0) 55%), radial-gradient(140% 120% at 50% 120%, color-mix(in srgb, var(--accent,#E0653C) 9%, transparent) 0%, rgba(0,0,0,0) 55%)"></div>
        <div data-ruler="" style="position:relative;z-index:1;display:flex;height:100%;overflow:auto;font-size:12px;line-height:1.6">
          <div style="color:#4A463F;border-right:1px solid #241F19;text-align:right;padding:8px 4px 8px 10px;user-select:none;min-width:2ch">
            <sc-for list="{{ lineNumbers }}" as="ln" hint-placeholder-count="3"><div>{{ ln }}</div></sc-for>
          </div>
          <div style="position:relative;flex:1;min-width:0">
            <div aria-hidden="true" style="position:absolute;inset:0;padding:8px 12px;margin:0;white-space:pre;pointer-events:none;color:#E8E3DB;text-shadow:0 0 7px color-mix(in srgb, var(--accent,#E0653C) 22%, transparent), 0 0 4px rgba(232,227,219,0.28)">{{ codeHighlight }}</div>
            <textarea wrap="off" spellcheck="false" rows="{{ lineCount }}" value="{{ currentCode }}" onChange="{{ onCodeChange }}" style="position:relative;display:block;width:100%;min-height:280px;border:none;outline:none;resize:none;background:transparent;color:transparent;caret-color:var(--accent,#E0653C);padding:8px 12px;margin:0;font-family:inherit;font-size:12px;line-height:1.6;white-space:pre;overflow:hidden;box-sizing:border-box"></textarea>
          </div>
        </div>
        <a href="https://faustdoc.grame.fr/manual/quick-start/" target="_blank" rel="noopener noreferrer" aria-label="Faust documentation" style="position:absolute;right:16px;bottom:12px;color:#7A7570;opacity:0.3;z-index:4;line-height:0">{{ faustLogo }}</a>
      </div>

      <!-- METER RAIL: LED SCREEN (beside editor) -->
      <div style="flex:none;position:relative;background:#0A0806;border-left:1px solid #000;box-shadow:inset 0 2px 14px rgba(0,0,0,0.85), inset 0 0 44px rgba(0,0,0,0.4);display:flex;flex-direction:column;z-index:0">
        <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;z-index:0;background-image:url('textures/glass.jpg');background-size:cover;background-position:center;mix-blend-mode:var(--glass-blend,screen);opacity:var(--glass-strength,0.12)"></div>
        <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;z-index:2;background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 3px, rgba(0,0,0,0.22) 3px, rgba(0,0,0,0.22) 4px)"></div>
        <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;z-index:3;background:linear-gradient(157deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 14%, rgba(255,255,255,0) 32%)"></div>
        <div style="position:relative;z-index:1;padding:14px 14px;display:flex;gap:12px;flex:1;min-height:0;justify-content:center">
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;min-height:0">
            <span style="font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:#7A7570">OUT</span>
            <div style="display:flex;gap:5px"><span style="font-size:9px;color:#5A5550;width:7px;text-align:center">L</span><span style="font-size:9px;color:#5A5550;width:7px;text-align:center">R</span></div>
            <div style="display:flex;gap:5px;flex:1;min-height:0;align-items:stretch">
              <div style="position:relative;width:7px;background:#17150F;border-radius:1px;box-shadow:inset 0 1px 2px rgba(0,0,0,0.6);overflow:hidden"><div ref="{{ outLRef }}" style="position:absolute;bottom:0;width:100%;height:58%;background:linear-gradient(to top,#E8E3DB,var(--accent,#E0653C))"></div><div style="position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to top,rgba(9,8,6,0) 0px,rgba(9,8,6,0) 2.6px,#090806 2.6px,#090806 4.1px)"></div></div>
              <div style="position:relative;width:7px;background:#17150F;border-radius:1px;box-shadow:inset 0 1px 2px rgba(0,0,0,0.6);overflow:hidden"><div ref="{{ outRRef }}" style="position:absolute;bottom:0;width:100%;height:52%;background:linear-gradient(to top,#E8E3DB,var(--accent,#E0653C))"></div><div style="position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to top,rgba(9,8,6,0) 0px,rgba(9,8,6,0) 2.6px,#090806 2.6px,#090806 4.1px)"></div></div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:center"><span style="font-family:var(--lcd-font,'Doto'),monospace;font-size:9px;font-variant-numeric:tabular-nums;color:#9A9088;text-shadow:0 0 5px rgba(154,144,136,0.4);width:5ch;text-align:center">-3.1</span><span style="font-family:var(--lcd-font,'Doto'),monospace;font-size:9px;font-variant-numeric:tabular-nums;color:#9A9088;text-shadow:0 0 5px rgba(154,144,136,0.4);width:5ch;text-align:center">-4.0</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- SEAM input/workspace -->
    <div style="height:2px;flex:none;background:linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(255,255,255,0.03) 65%, rgba(255,255,255,0.11) 100%)"></div>

    <!-- WORKSPACE (full width) -->
    <div style="display:flex;flex-direction:column;background:#252320;position:relative;z-index:0;box-shadow:inset 0 1px 0 rgba(255,255,255,0.03)">
      <div aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;z-index:-1;background-image:url('textures/metal.jpg');background-size:cover;background-position:center;mix-blend-mode:var(--metal-blend,soft-light);opacity:var(--metal-strength,0.3)"></div>
      <div style="display:flex;align-items:center;padding:0 16px;height:44px;gap:10px">
        <button type="button" onClick="{{ showControls }}" style="{{ controlsTabStyle }}">CONTROLS</button>
        <span style="font-size:10px;color:#4A463F">/</span>
        <button type="button" onClick="{{ showDiagram }}" style="{{ diagramTabStyle }}">DIAGRAM</button>
        <div style="margin-left:auto;display:flex;align-items:center;gap:14px">
          <sc-if value="{{ isDiagram }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-family:var(--lcd-font,'Doto'),monospace;font-size:10px;color:#9A9088;font-variant-numeric:tabular-nums;text-shadow:0 0 5px rgba(154,144,136,0.4)">{{ scalePct }}%</span>
              <button type="button" onClick="{{ resetView }}" style="padding:4px 8px;background:transparent;border:1px solid #3A3632;color:#7A7570;cursor:pointer;font-size:10px;text-transform:uppercase;letter-spacing:0.06em;font-family:inherit;border-radius:3px" style-hover="color:#E8E3DB;border-color:var(--accent,#E0653C)">RESET</button>
            </div>
          </sc-if>
          <span style="font-size:9px;text-transform:uppercase;letter-spacing:0.06em;color:#7A7570">©&nbsp;ZCROSS</span>
        </div>
      </div>

      <!-- CONTROLS -->
      <sc-if value="{{ isControls }}" hint-placeholder-val="{{ true }}">
        <div data-ruler="" style="height:300px;max-height:300px;overflow-y:auto;padding:0 16px 14px;display:flex;flex-direction:column;gap:10px;position:relative;z-index:1">
          <div style="display:flex;flex-direction:column;gap:10px">
            <div style="display:flex;align-items:center;gap:8px;padding-top:8px"><span style="font-size:10px;text-transform:uppercase;letter-spacing:0.1em;color:#E8E3DB">SYNTH</span></div>
            <div style="display:flex;flex-direction:column;gap:8px">
              <div style="display:flex;align-items:center;gap:8px;padding-left:12px"><span style="font-size:10px;color:var(--accent,#E0653C);opacity:0.7">└</span><span style="font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:#B8B0A6">OSCILLATOR</span></div>
              <div style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px 20px;padding-bottom:8px;padding-left:28px">
                <dc-import name="Knob" value="{{ 0.22 }}" display="440" label="FREQ" hint-size="48px,62px"></dc-import>
                <dc-import name="Knob" value="{{ 0.55 }}" display="+3¢" label="DETUNE" hint-size="48px,62px"></dc-import>
                <dc-import name="Knob" value="{{ 0.7 }}" display="-12dB" label="GAIN" hint-size="48px,62px"></dc-import>
                <dc-import name="Knob" value="{{ 0.4 }}" display="4" label="VOICES" hint-size="48px,62px"></dc-import>
                <div style="display:flex;flex-direction:column;align-items:center;gap:8px;user-select:none">
                  <div style="display:grid;gap:2px;grid-template-columns:repeat(4,1fr);background:#100E0B;border-radius:3px;padding:2px;box-shadow:inset 0 1px 2px rgba(0,0,0,0.7)">

      if (!el.style.backgroundImage || el.style.backgroundImage.indexOf("metal") === -1) return;
      const r = el.getBoundingClientRect();
      el.style.backgroundSize = size;
      el.style.backgroundPosition = (-((r.left - fr.left) / k)).toFixed(1) + "px " + (-((r.top - fr.top) / k)).toFixed(1) + "px";
    });
  }

  tokenizeCode(code) {
    const FN = "#47A5A5", STR = "#A8A545", NUM = "#C98A6C", OP = "#7A7570", TXT = "#E8E3DB";
    const re = /("[^"]*")|(\d+\.?\d*)|([A-Za-z_][A-Za-z0-9_]*)|(\s+)|([^\s])/g;
    const out = [];
    let m, idx = 0;
    while ((m = re.exec(code))) {
      const t = m[0];
      let color = TXT;
      if (t[0] === '"') color = STR;
      else if (/^\d/.test(t)) color = NUM;
      else if (/^[A-Za-z_]/.test(t)) {
        const prev = code[m.index - 1];
        let j = m.index + t.length;
        while (j < code.length && /\s/.test(code[j])) j++;
        color = prev === "." || code[j] === "(" ? FN : TXT;
      } else if (!/^\s+$/.test(t)) color = OP;
      out.push(React.createElement("span", { key: idx++, style: { color } }, t));
    }
    return out;
  }

  faustLogoEl() {
    const D = (typeof window !== "undefined" && window.FAUST_PATH) || null;
    if (!D) return null;
    return React.createElement("svg", { width: 68, height: 13.14, viewBox: "0 0 64.333327 12.414666", xmlns: "http://www.w3.org/2000/svg", fill: "currentColor" },
      React.createElement("g", { transform: "matrix(1.3333333,0,0,-1.3333333,-31.440266,68.495732)" },
        React.createElement("path", { d: D, transform: "translate(69.0172,49.3868)", fillRule: "nonzero" })));
  }

  componentDidMount() {
    this.loadInk();
    this.applyVars();
    this._onResize = () => this.positionTextures();
    window.addEventListener("resize", this._onResize);
    requestAnimationFrame(() => this.positionTextures());
    setTimeout(() => this.positionTextures(), 400);
    const loop = () => { this.tick(); this._raf = requestAnimationFrame(loop); };
    this._raf = requestAnimationFrame(loop);
  }
  componentDidUpdate(prevProps) {
    this.applyVars();
    this.positionTextures();
    if (prevProps.variant !== this.props.variant && this.props.variant) this.setState({ variant: this.props.variant });
    if (prevProps.startPanel !== this.props.startPanel && this.props.startPanel) this.setState({ tab: this.props.startPanel });
    if (prevProps.bypassed !== this.props.bypassed) this.setState({ bypass: !!this.props.bypassed });
  }
  componentWillUnmount() { cancelAnimationFrame(this._raf); window.removeEventListener("resize", this._onResize); }

  tick() {
    if (this.props.animate === false) return;
    this._t += 0.016;
    const t = this._t;
    const g = this.state.bypass ? 0.12 : 1;
    const set = (ref, base, ph) => {
      if (!ref.current) return;
      const w = base + 0.11 * Math.sin(t * 6 + ph) + 0.06 * Math.sin(t * 13 + ph * 2);
      ref.current.style.height = Math.max(2, Math.min(100, w * 100)) + "%";
    };
    set(this.meterRefs.inL, 0.5 * g, 0);
    set(this.meterRefs.inR, 0.46 * g, 1.3);
    set(this.meterRefs.outL, 0.62 * g, 2.1);
    set(this.meterRefs.outR, 0.57 * g, 3.4);
  }

  renderVals() {
    const variant = this.state.variant;
    const tab = this.state.tab;
    const bypass = this.state.bypass;
    const scale = this.state.scale, tx = this.state.tx, ty = this.state.ty;
    const accent = this.accent();

    const isInstrument = variant === "instrument";
    const isFx = variant === "fx";
    const isControls = tab === "controls";
    const isDiagram = tab === "diagram";

    const currentCode = isInstrument
      ? (this.state.codeInstrument ?? this.INSTRUMENT_DEMO)
      : (this.state.codeFx ?? this.FX_DEMO);
    const lines = currentCode.split("\n");

    const glow = ", 0 0 8px color-mix(in srgb, " + accent + " 55%, transparent), 0 0 3px color-mix(in srgb, " + accent + " 48%, transparent)";
    const lensOff = "linear-gradient(180deg, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0.04) 16%, rgba(255,255,255,0) 36%), radial-gradient(120% 135% at 50% 20%, #575249 0%, #3E392F 54%, #2A2721 100%)";
    const shadowOff = "inset 0 1px 0 rgba(255,255,255,0.14), inset 0 -2px 3px rgba(0,0,0,0.3), 0 2px 0 #201D18, 0 2px 3px rgba(0,0,0,0.45)";
    const lensOn = "radial-gradient(120% 100% at 50% 40%, color-mix(in srgb," + accent + " 50%, #ffffff) 0%, " + accent + " 44%, color-mix(in srgb," + accent + " 80%, #000000) 100%)";
    const shadowOn = "inset 0 1px 2px rgba(0,0,0,0.3), 0 2px 0 #241E1A, 0 3px 4px rgba(0,0,0,0.45)" + glow;
    const offIcon = "#948E84";
    const negIcon = "color-mix(in srgb, " + accent + " 26%, #130a0b)";
    const powerOn = !bypass;

    const wsTabBase = "background:transparent;border:none;padding:2px 0;cursor:pointer;font-family:inherit;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;";

    const segBase = "border:none;cursor:pointer;font-family:inherit;font-size:10px;font-variant-numeric:tabular-nums;text-transform:uppercase;letter-spacing:0.06em;padding:3px 7px;border-radius:2px;transition:background 0.1s ease;";
    const segOff = segBase + "background:transparent;color:#7A7570;";
    const segOn = segBase + "background:" + accent + ";color:#140A0B;box-shadow:0 0 6px color-mix(in srgb, " + accent + " 60%, transparent);";

    return {
      frameRef: this.frameRef,
      titleRef: this.titleRef,
      isInstrument, isFx, isControls, isDiagram,
      variantLabel: isInstrument ? "INSTRUMENT" : "FX",
      currentCode,
      lineCount: lines.length,
      lineNumbers: lines.map((_, i) => i + 1),
      codeHighlight: this.tokenizeCode(currentCode),
      faustLogo: this.faustLogoEl(),
      scalePct: (scale * 100).toFixed(0),
      diagramInnerStyle:
        "position:absolute;top:50%;left:50%;transform-origin:center;transform:translate(-50%,-50%) translate(" +
        tx + "px," + ty + "px) scale(" + scale + ");",
      powerColor: powerOn ? negIcon : offIcon,
      powerBtnBg: powerOn ? lensOn : lensOff,
      powerBtnShadow: powerOn ? shadowOn : shadowOff,
      powerBtnTransform: powerOn ? "translateY(1px)" : "translateY(0)",
      lensOnBg: lensOn,
      lensOnShadow: shadowOn,
      lensOffBg: lensOff,
      lensOffShadow: shadowOff,
      segOnStyle: segOn,
      segOffStyle: segOff,
      controlsTabStyle: wsTabBase + (isControls ? "color:#E8E3DB;" : "color:#7A7570;"),
      diagramTabStyle: wsTabBase + (isDiagram ? "color:#E8E3DB;" : "color:#7A7570;"),
      toolBtnStyle: "display:flex;align-items:center;gap:4px;padding:4px 8px;background:transparent;border:1px solid #3A3632;color:#7A7570;cursor:pointer;font-size:10px;text-transform:uppercase;letter-spacing:0.06em;font-family:inherit;border-radius:3px;",
      inLRef: this.meterRefs.inL,
      inRRef: this.meterRefs.inR,
      outLRef: this.meterRefs.outL,
      outRRef: this.meterRefs.outR,
      toggleBypass: () => this.setState((s) => ({ bypass: !s.bypass })),
      showControls: () => this.setState({ tab: "controls" }),
      showDiagram: () => this.setState({ tab: "diagram" }),
      resetView: () => this.setState({ scale: 1, tx: 0, ty: 0 }),
      onCodeChange: (e) => {
        const v = e.target.value;
        if (isInstrument) this.setState({ codeInstrument: v });
        else this.setState({ codeFx: v });
      },
      onWheel: (e) => {
        const delta = -e.deltaY * 0.001;
        const next = Math.min(4, Math.max(0.25, this.state.scale * (1 + delta)));
        this.setState({ scale: next });
      },
      onMouseDown: (e) => {
        this.drag = { x: e.clientX, y: e.clientY, startTx: this.state.tx, startTy: this.state.ty };
      },
      onMouseMove: (e) => {
        if (!this.drag) return;
        this.setState({ tx: this.drag.startTx + (e.clientX - this.drag.x), ty: this.drag.startTy + (e.clientY - this.drag.y) });
      },
      onMouseUp: () => { this.drag = null; },
    };
  }
}
</script>
</body>
</html>
