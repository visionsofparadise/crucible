    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crucible</title>

      /* Page sizes to the editor's intrinsic content. The JUCE editor's

      html, body, #root { margin: 0; padding: 0; overflow: hidden; width: max-content; height: max-content; }
      body { background: transparent; }
    </style>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
